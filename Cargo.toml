[package]
name = "openhtpc-renamer"
version = "0.1.0-rc.1"
edition = "2021"
description = "Renommage de médiathèque (films, séries, DVD, Blu-ray, UHD) avec identification TMDB pour OpenHTPC"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
regex = "1"
once_cell = "1"
walkdir = "2"
rayon = "1"
async-channel = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-normalization = "0.1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
